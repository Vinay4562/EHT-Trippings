<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, private">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #fff;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .header .logo {
            width: 130px;
            height: auto;
            margin-left: 30px;
        }

        .header h1 {
            margin: 0;
            color: red;
            font-size: 35px;
            font-weight: 600;
            font-family: 'Roboto', sans-serif;
            margin-left: 20px;
            white-space: nowrap;
        }

        .hamburger {
            display: none;
            font-size: 30px;
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
            margin-right: 20px;
        }

        .navbar {
            display: flex;
            justify-content: center;
            background: transparent;
            padding: 10px 0;
            position: fixed;
            top: 100px;
            width: 100%;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s, color 0.3s;
            text-align: center;
        }

        .navbar a:hover,
        .navbar a.active {
            background-color: #0056b3;
            color: #fff;
            border-radius: 4px;
        }

        /* Mobile Menu Overlay */
        .navbar.active {
            display: block;
            position: fixed;
            top: 0;
            right: 0;
            width: 250px;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 60px 20px 20px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
        }

        .navbar.active a {
            display: block;
            margin: 15px 0;
            text-align: left;
            color: #333;
        }

        .navbar.active a:hover {
            background-color: #007bff;
            color: #fff;
        }

        .close-btn {
            display: none; /* Hidden by default in desktop */
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
        }

        .navbar.active .close-btn {
            display: block; /* Visible in mobile overlay */
        }

        .login-container {
            background: #fff;
            margin-top: 150px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 350px;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            opacity: 0.2;
            z-index: 0;
            transition: opacity 0.3s;
        }

        .login-container:hover::before {
            opacity: 0.4;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
            z-index: 1;
            position: relative;
            text-decoration: underline;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 40px;
        }

        .password-container .toggle-icon {
            position: absolute;
            top: 50%;
            margin-top: 10px;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #007bff;
            transition: color 0.3s;
        }

        .password-container .toggle-icon:hover {
            color: #0056b3;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #007bff, #00c6ff);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
            position: relative;
            z-index: 1;
        }

        button:hover {
            background: linear-gradient(45deg, #0056b3, #007bff);
            transform: scale(1.05);
        }

        #error-message, #success-message {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }

        #error-message {
            color: red;
        }

        #success-message {
            color: green;
        }

        /* Media Queries for Responsiveness */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 25px;
                margin-left: 15px;
            }

            .header h1::before {
                content: "TG TRANSCO";
            }

            .hamburger {
                display: block;
            }

            .navbar {
                display: none;
            }

            .navbar.active {
                display: block;
            }

            .login-container {
                width: 80%; /* Reduced from 90% */
                max-width: 300px; /* Added max-width for control */
                padding: 25px;
                margin-top: 120px;
            }

            .header .logo {
                width: 100px;
                margin-left: 15px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
                margin-left: 10px;
            }

            .header .logo {
                width: 80px;
                margin-left: 10px;
            }

            .hamburger {
                font-size: 24px;
            }

            .login-container {
                width: 75%; /* Further reduced */
                max-width: 280px; /* Adjusted max-width */
                padding: 20px;
            }

            h2 {
                font-size: 1.5rem;
            }

            .navbar.active {
                width: 200px;
            }
        }

        @media (min-width: 769px) {
            .header h1::before {
                content: "𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃";
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="logo_new.png" alt="Company Logo" class="logo">
            <h1></h1>
        </div>
        <button class="hamburger">☰</button>
    </header>

    <div class="navbar">
        <button class="close-btn">✕</button>
        <a href='https://400kvssshankarpally.free.nf/'>Home</a>
        <a href="#">LC Procedures</a>
        <a href='https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/Displaydata_original.html'>Max-Min data</a>
    </div>

    <div class="login-container">
        <h2>EHT Trippings Login</h2>
        <form id="login-form" action="/login" method="POST">
            <div class="input-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required aria-label="Username">
            </div>
            <div class="input-group password-container">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required aria-label="Password">
                <i class="fas fa-eye toggle-icon" id="togglePassword" aria-label="Show password"></i>
            </div>
            <button type="submit">Login</button>
            <div id="error-message"></div>
            <div id="success-message"></div>
        </form>
    </div>

    <script>
        // Toggle Hamburger Menu
        document.querySelector('.hamburger').addEventListener('click', function() {
            document.querySelector('.navbar').classList.toggle('active');
        });

        // Close Hamburger Menu
        document.querySelector('.close-btn').addEventListener('click', function() {
            document.querySelector('.navbar').classList.remove('active');
        });

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const errorMessageDiv = document.getElementById('error-message');
            const successMessageDiv = document.getElementById('success-message');
            const passwordField = document.getElementById('password');
            const togglePassword = document.getElementById('togglePassword');

            // Check for query parameters
            const queryParams = new URLSearchParams(window.location.search);
            const message = queryParams.get('message');
            if (message === 'logout-success') {
                successMessageDiv.textContent = 'You have successfully logged out.';
            }

            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const username = document.getElementById('username').value;
                const password = passwordField.value;

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    if (response.ok) {
                        // Reset the credentials in the form fields
                        document.getElementById('username').value = '';
                        document.getElementById('password').value = '';

                        successMessageDiv.textContent = 'Login successful!';
                        setTimeout(() => {
                            window.location.href = 'trippings.html';
                        }, 1000);
                    } else {
                        const message = await response.text();
                        errorMessageDiv.textContent = 'Login failed: ' + message;
                    }
                } catch (error) {
                    errorMessageDiv.textContent = 'Error: ' + error.message;
                }
            });

            togglePassword.addEventListener('click', () => {
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    togglePassword.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    passwordField.type = 'password';
                    togglePassword.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });

            // Clear form fields on page load
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });

        document.addEventListener('DOMContentLoaded', () => {
            const queryParams = new URLSearchParams(window.location.search);
            if (queryParams.get('logout') === 'success') {
                document.getElementById('success-message').textContent = 'You have successfully logged out.';
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            }
        });

        // Prevent back navigation
        window.history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', function () {
            window.history.pushState(null, null, window.location.href);
        });
    </script>
</body>
</html>
